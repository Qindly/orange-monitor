services:
  postgres:
    image: postgres:16-alpine
    container_name: orange-monitor-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orange_monitor
      POSTGRES_PASSWORD: orange_monitor
      POSTGRES_DB: orange_monitor
    volumes:
      - orange_monitor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orange_monitor -d orange_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orange_monitor_pgdata:
